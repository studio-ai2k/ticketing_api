name: XR3 probe (read-only, never merged)

# Festiflow guide round XR3 · 2026-10-22. Lives on `probe/xr3` only, never merged.
# Read-only on both platforms: GET on Shotgun, GraphQL *queries* on DICE.
# ticketing_api is PUBLIC and so are these logs: the probe prints and commits
# field names, counts and timings only. Money totals and ticket-id sets are
# sealed (seal.sh) to a key only the measurement seat holds and leave as an
# encrypted 3-day artifact. Each secret is named only in the step that uses it.
# A push to probe/xr3 touching guide/xr3/RUN runs it (first word = mode).
on:
  workflow_dispatch:
  push:
    branches: [probe/xr3]
    paths: [guide/xr3/RUN]

concurrency:
  group: xr3-probe
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mode:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.m.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: echo "mode=$(awk 'NR==1{print $1}' guide/xr3/RUN)" >> "$GITHUB_OUTPUT"

  shotgun_episode:
    needs: mode
    if: needs.mode.outputs.mode == 'measure'
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Shotgun EPISODE (M1 walk, M4, M6, M7)
        env:
          SHOTGUN_TOKEN_EPISODE: ${{ secrets.SHOTGUN_TOKEN_EPISODE }}
          SHOTGUN_ORGANIZER_ID_EPISODE: ${{ secrets.SHOTGUN_ORGANIZER_ID_EPISODE }}
        run: python -I guide/xr3/probe_xr3.py shotgun episode
      - name: Seal private outputs
        if: always()
        run: bash guide/xr3/seal.sh shotgun_episode
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xr3-out-shotgun_episode
          path: guide/xr3/out/xr3_*
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xr3-sealed-shotgun_episode
          path: guide/xr3/sealed/*
          retention-days: 3
          if-no-files-found: ignore

  shotgun_sonora:
    needs: mode
    if: needs.mode.outputs.mode == 'measure'
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Shotgun SONORA (M1 walk, M4, M6, M7)
        env:
          SHOTGUN_TOKEN_SONORA: ${{ secrets.SHOTGUN_TOKEN_SONORA }}
          SHOTGUN_ORGANIZER_ID_SONORA: ${{ secrets.SHOTGUN_ORGANIZER_ID_SONORA }}
        run: python -I guide/xr3/probe_xr3.py shotgun sonora
      - name: Seal private outputs
        if: always()
        run: bash guide/xr3/seal.sh shotgun_sonora
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xr3-out-shotgun_sonora
          path: guide/xr3/out/xr3_*
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xr3-sealed-shotgun_sonora
          path: guide/xr3/sealed/*
          retention-days: 3
          if-no-files-found: ignore

  dice:
    needs: mode
    if: needs.mode.outputs.mode == 'measure'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: DICE (M4 history, M6 fields and fills, M7 schema)
        env:
          DICE_TOKEN: ${{ secrets.DICE_TOKEN }}
        run: python -I guide/xr3/probe_xr3.py dice
      - name: Seal private outputs
        if: always()
        run: bash guide/xr3/seal.sh dice
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xr3-out-dice
          path: guide/xr3/out/xr3_*
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xr3-sealed-dice
          path: guide/xr3/sealed/*
          retention-days: 3
          if-no-files-found: ignore

  commit:
    needs: [mode, shotgun_episode, shotgun_sonora, dice]
    if: always() && needs.mode.outputs.mode == 'measure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: probe/xr3
      - uses: actions/download-artifact@v4
        with:
          pattern: xr3-out-*
          path: _art
      - name: Gather (counts only; sealed artifacts are never downloaded here)
        run: |
          mkdir -p guide/xr3/out
          find _art -type f -name 'xr3_*' -exec cp {} guide/xr3/out/ \;
          ls -la guide/xr3/out
      - name: Leak check (refuse to commit on any hit)
        env:
          SHOTGUN_TOKEN_EPISODE: ${{ secrets.SHOTGUN_TOKEN_EPISODE }}
          SHOTGUN_TOKEN_SONORA: ${{ secrets.SHOTGUN_TOKEN_SONORA }}
          DICE_TOKEN: ${{ secrets.DICE_TOKEN }}
        run: |
          set -u
          umask 077
          f=$(mktemp)
          for v in "$SHOTGUN_TOKEN_EPISODE" "$SHOTGUN_TOKEN_SONORA" "$DICE_TOKEN"; do [ -n "$v" ] && printf '%s\n' "$v" >> "$f"; done
          hits=0
          if [ -s "$f" ] && grep -rqF -f "$f" guide/xr3/out; then echo "LEAK: a secret value"; hits=1; fi
          rm -f "$f"
          for rx in 'token=[^*]' 'key=[^*]' '[Bb]earer [^*]' 'eyJ[A-Za-z0-9_-]{5,}\.' '[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+\.[A-Za-z]{2,}' 'https?://' 'contact_email"[: ]+"' 'ticket_scan_code"[: ]+"' '"money' 'money_by_event' 'ticket_ids_by_event' 'resume_cursor' ; do
            if grep -rqE -- "$rx" guide/xr3/out; then echo "LEAK pattern: $rx"; hits=1; fi
          done
          [ "$hits" = 0 ] && echo "leak check: 0 hits"
          exit $hits
      - name: Commit counts to probe/xr3
        run: |
          git config user.name 'xr3-probe'
          git config user.email 'xr3-probe@users.noreply.github.com'
          git add guide/xr3/out
          git commit -m "XR3 probe outputs (counts only) · run ${{ github.run_id }}" || echo 'nothing to commit'
          git push origin HEAD:probe/xr3
