name: Deploy to Pages

# Replaces the legacy branch-source Pages build, whose deploy step polls for
# ten minutes and then gives up:
#
#   Current status: deployment_in_progress   (x10 minutes)
#   ##[error]Timeout reached, aborting!
#
# Run 31109919687 hit that with no competing push, so it is the deploy itself
# that is slow, not a race. deploy-pages@v4 takes an explicit timeout, so the
# same deployment gets 30 minutes instead of 10.
on:
  push:
    branches: [main]
    paths: ['*.html']
  # The dashboards are committed by the daily job using GITHUB_TOKEN, and a
  # push made with that token deliberately does not start new workflow runs -
  # so the push trigger above never fires for the commits that actually matter.
  # Chain off the run instead. (First observed on 12182c4: six rebuilt
  # dashboards landed on main and no deploy was queued.)
  workflow_run:
    workflows: ['Daily dashboards']
    types: [completed]
  workflow_dispatch:

permissions:
  # checkout needs contents; the Pages deployment needs the other two.
  contents: read
  pages: write
  id-token: write

# Never cancel a deployment in flight - that is what left the site serving a
# stale build for hours. Queue behind it instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          # Switches the Pages source from branch to GitHub Actions. Harmless
          # once it is already set; if the token may not change repository
          # settings this step fails loudly rather than letting the deploy
          # fail later for an unrelated-looking reason.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Milliseconds; default 600000. NOTE: this did not take effect - run
          # 31112613042 still aborted with "Timeout reached, aborting!" after
          # 10m05s with this set to 30 minutes. Left in place because it costs
          # nothing, but the deploy is not waiting any longer because of it.
          #
          # The underlying problem is upstream: the Pages deployment sits in
          # deployment_in_progress and never reports success, under both the
          # legacy branch source and this one. Payload is not the cause - the
          # published tree is 14 MB across 42 files.
          timeout: 1800000
