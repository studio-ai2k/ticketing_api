name: Verify incremental fetch

# Manual-only. Answers the one thing that cannot be checked offline: does
# Shotgun accept a cursor we synthesised from the last row of a completed
# fetch, rather than one it handed us in pagination.next?
#
# Self-contained on purpose - it does a full fetch and an incremental fetch in
# the same job, so it needs no committed state and can run before the daily
# job has ever seeded one.
on:
  workflow_dispatch:
    inputs:
      event:
        description: 'event_id to verify'
        required: true
        default: 'rennes_2026'
      backdate_hours:
        description: 'Rewind the cursor this many hours so the delta is non-empty (0 = resume from the tip)'
        required: false
        default: '0'

jobs:
  verify:
    name: full vs incremental
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Europe/Paris
      SHOTGUN_PAGE_PACING_S: '0.8'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Full fetch (writes the cursor)
        env:
          SHOTGUN_TOKEN_EPISODE: ${{ secrets.SHOTGUN_TOKEN_EPISODE }}
          SHOTGUN_TOKEN_SONORA: ${{ secrets.SHOTGUN_TOKEN_SONORA }}
          SHOTGUN_ORGANIZER_ID_SONORA: ${{ secrets.SHOTGUN_ORGANIZER_ID_SONORA }}
          DICE_TOKEN: ${{ secrets.DICE_TOKEN }}
        run: |
          mkdir -p api_output data
          start=$(date +%s)
          python fetch_csv.py --event "${{ inputs.event }}" --full \
            --out "api_output/full.csv" 2>&1 | tee full.log
          echo "FULL_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
          cp "api_output/full.csv" "data/${{ inputs.event }}_merged.csv"
          echo "--- cursor state written:"
          cat "data/${{ inputs.event }}_state.json"

      - name: Rewind the cursor
        if: inputs.backdate_hours != '0'
        env:
          EVENT: ${{ inputs.event }}
          HOURS: ${{ inputs.backdate_hours }}
        run: |
          python - <<'PY'
          import csv, json, os
          from datetime import datetime, timedelta, timezone

          event, hours = os.environ['EVENT'], int(os.environ['HOURS'])
          cutoff = datetime.now(timezone.utc) - timedelta(hours=hours)
          naive = cutoff.replace(tzinfo=None)

          # H12: truncate the stored file to what existed at the cutoff. Leaving
          # the whole file in place and only rewinding the cursor would ask the
          # API to re-return rows the stored file already holds, and the
          # comparison would be arithmetic on an inflated base - it can pass
          # while the cursor is mispositioned.
          rows = list(csv.DictReader(open('api_output/full.csv', encoding='utf-8')))
          keep = [r for r in rows
                  if datetime.fromisoformat(r['order_datetime']) <= naive]
          with open(f'data/{event}_merged.csv', 'w', newline='', encoding='utf-8') as f:
              w = csv.DictWriter(f, fieldnames=list(rows[0]))
              w.writeheader()
              w.writerows(keep)

          kept_sg = [r for r in keep if r['platform'] == 'Shotgun']
          max_ordered = max((r['order_datetime'] for r in kept_sg), default=None)
          # Cursor is {ticket_updated_at}_{ticket_id}; _0 sorts before any real
          # id at that instant, so nothing at the boundary is skipped.
          json.dump({
              'cursor': cutoff.strftime('%Y-%m-%dT%H:%M:%S.000Z') + '_0',
              'rows': len(kept_sg),
              'max_ordered_at': max_ordered,
              'shotgun_event_id': json.load(
                  open(f'data/{event}_state.json'))['shotgun_event_id'],
          }, open(f'data/{event}_state.json', 'w'), indent=2, sort_keys=True)

          sg_total = sum(1 for r in rows if r['platform'] == 'Shotgun')
          print(f"cutoff {naive} | stored {len(kept_sg)} of {sg_total} Shotgun rows"
                f" | expecting a delta of {sg_total - len(kept_sg)}")
          PY
          cat "data/${{ inputs.event }}_state.json"

      - name: Incremental fetch (resumes from that cursor)
        env:
          SHOTGUN_TOKEN_EPISODE: ${{ secrets.SHOTGUN_TOKEN_EPISODE }}
          SHOTGUN_TOKEN_SONORA: ${{ secrets.SHOTGUN_TOKEN_SONORA }}
          SHOTGUN_ORGANIZER_ID_SONORA: ${{ secrets.SHOTGUN_ORGANIZER_ID_SONORA }}
          DICE_TOKEN: ${{ secrets.DICE_TOKEN }}
        run: |
          start=$(date +%s)
          python fetch_csv.py --event "${{ inputs.event }}" --incremental \
            --out "api_output/incr.csv" 2>&1 | tee incr.log
          echo "INCR_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"

      - name: Compare
        env:
          BACKDATE_HOURS: ${{ inputs.backdate_hours }}
        run: |
          {
            echo "### Incremental verification - ${{ inputs.event }}"
            echo ""
            echo "| | full | incremental |"
            echo "|---|---|---|"
            echo "| wall clock | ${FULL_SECONDS}s | ${INCR_SECONDS}s |"
            python - <<'PY'
          import csv, os
          from collections import Counter

          def load(p):
              return list(csv.DictReader(open(p, encoding='utf-8')))

          a, b = load('api_output/full.csv'), load('api_output/incr.csv')
          ca, cb = Counter(r['platform'] for r in a), Counter(r['platform'] for r in b)
          ga = sum(float(r['gross_price']) for r in a if r['is_paid'] == '1')
          gb = sum(float(r['gross_price']) for r in b if r['is_paid'] == '1')
          print(f"| rows | {len(a)} | {len(b)} |")
          print(f"| shotgun | {ca.get('Shotgun',0)} | {cb.get('Shotgun',0)} |")
          print(f"| dice | {ca.get('DICE',0)} | {cb.get('DICE',0)} |")
          print(f"| gross (paid) | {ga:,.2f} | {gb:,.2f} |")
          print("")

          # The full fetch's rows must all survive into the incremental one.
          # Compared as multisets of the 11 columns - the merge sorts by date,
          # so ordering is not meaningful and identity is not available.
          key = lambda r: tuple(r[c] for c in r)
          ma, mb = Counter(map(key, a)), Counter(map(key, b))
          lost, gained = ma - mb, mb - ma
          print(f"- rows in full but missing from incremental: **{sum(lost.values())}**")
          print(f"- rows only in incremental (new sales since): **{sum(gained.values())}**")

          # The real question. If Shotgun ignored or rejected the cursor the
          # incremental pass would have refetched everything, and its delta
          # would be the size of the whole event.
          import re
          log = open('incr.log', encoding='utf-8').read()
          appended = re.search(r'appended (\d+) new Shotgun row', log)
          trip = re.search(r'H3-TRIP event=(\S+) reason=(\S+)', log)
          resumed = 'incremental:' in log
          backdated = os.environ.get('BACKDATE_HOURS', '0') != '0'
          sg_full = ca.get('Shotgun', 0)

          print(f"- resumed from a cursor: **{resumed}**")
          if trip:
              print(f"- H3 guard tripped: **yes**, reason `{trip.group(2)}`")
          else:
              print("- H3 guard tripped: **no**")
          if appended:
              n = int(appended.group(1))
              print(f"- delta fetched: **{n}** rows (full Shotgun side is {sg_full})")
          print("")

          # H13: three outcomes, and two of them are passes. A backdated window
          # containing a refund makes H9 fire on a row whose ordered_at predates
          # the cutoff - that is the detector doing its job, and it aborts into
          # a full refetch, which looks exactly like a cursor failure unless the
          # reason is reported separately.
          if not resumed:
              verdict = "FAIL - did not resume from the cursor at all"
          elif trip and trip.group(2) == 'modified-rows':
              verdict = ("PASS (detector) - H9 caught a real modification inside "
                         "the window and fell back to a full refetch, which is "
                         "the designed behaviour. Cursor positioning untested "
                         "this run; re-run over a quieter window to test it.")
          elif trip:
              verdict = f"INVESTIGATE - H3 tripped for `{trip.group(2)}`"
          elif sum(lost.values()) or sum(gained.values()):
              verdict = ("FAIL - cursor mispositioned: the incremental result is "
                         "not the same multiset as the full fetch")
          elif backdated and appended and int(appended.group(1)) == 0:
              verdict = ("INCONCLUSIVE - backdated but the delta was empty, so "
                         "no sales fell in the window. Widen backdate_hours.")
          elif backdated:
              verdict = ("PASS (positioning) - resumed from a backdated cursor "
                         "and reproduced the full fetch exactly")
          else:
              verdict = ("PASS (accepted) - cursor accepted and no rows lost, "
                         "but the delta was empty so positioning is untested")
          print("Verdict: **" + verdict + "**")
          PY
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload both CSVs and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-${{ inputs.event }}
          path: |
            api_output/full.csv
            api_output/incr.csv
            full.log
            incr.log
            data/${{ inputs.event }}_state.json
          retention-days: 3
