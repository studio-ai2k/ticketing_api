name: Daily dashboards

# Every four hours: 00/04/08/12/16/20 UTC = 02/06/10/14/18/22 Paris.
#
# Actions minutes are free here because the repo is public, so cadence is not
# a cost question - it is about churn and queue exposure. Each run commits the
# dashboards, and runner queues reached 27 minutes on 2026-08-06, so hourly
# would buy 24 daily chances at contention and 24 commits of churn for numbers
# nobody reads hourly. Six snapshots a day is plenty for trend-watching, and
# every live event fetches in under two minutes.
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      events:
        description: 'Space-separated event_ids to rebuild (blank = every active event)'
        required: false
        default: ''
      force_rebuild:
        description: 'Rebuild and publish even when the data has not changed (use after a design change)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# A run can outlast its own interval: max-parallel is 1 and runner queues
# reached 27 minutes on 2026-08-06. Without this, two matrices race on the same
# files and one commit job lands on another's work.
concurrency:
  group: daily-dashboards
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- plan ----
  # Active events come from the config, not a hardcoded list, so adding an
  # event to event_config.csv is enough to get it its own build job.
  plan:
    name: List active events
    runs-on: ubuntu-latest
    outputs:
      events: ${{ steps.list.outputs.events }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build the matrix
        id: list
        env:
          ONLY: ${{ inputs.events }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import csv, json, os, sys
          from datetime import date, datetime, timedelta

          # A finished event's tickets cannot change, so refetching them every
          # run re-downloads frozen data - Paris XXL and Bordeaux Juin alone are
          # ~67k of ~93k tickets across the six. Skip the fetch and build from
          # the committed CSV instead.
          #
          # Derived from day_date rather than from status: status is also what
          # run.py uses to populate the session switcher, so demoting a finished
          # event would drop it from the dropdown on every dashboard. Deriving
          # gates the fetch and touches nothing else.
          #
          # Grace period is 30 days (stdlib only - no dateutil in this project,
          # so a calendar month is approximated). Sales run up to and during the
          # event, and refunds, chargebacks and settlement corrections land for
          # weeks afterwards; cutting the fetch the morning after would freeze
          # the numbers before they stop moving.
          GRACE_DAYS = 30
          today = date.today()

          only = set((os.environ.get('ONLY') or '').split())
          seen, out, notes, problems = set(), [], [], []
          days = {}
          for row in csv.DictReader(open('event_config.csv', encoding='utf-8-sig')):
              eid = (row.get('event_id') or '').strip()
              if not eid:
                  continue
              raw = (row.get('day_date') or '').strip()
              if raw:
                  try:
                      days.setdefault(eid, []).append(
                          datetime.strptime(raw, '%Y-%m-%d').date())
                  except ValueError:
                      # K2: never let an unparseable date read as "past" - that
                      # would silently stop fetching a live event.
                      problems.append(f"{eid}: unparseable day_date {raw!r}")
                      days.setdefault(eid, []).append(None)
              if eid in seen:
                  continue
              if (row.get('status') or '').strip() != 'active':
                  continue
              if not (row.get('event_name') or '').strip():
                  continue
              outfile = (row.get('output_filename') or '').strip()
              if not outfile:
                  continue
              if only and eid not in only:
                  continue
              seen.add(eid)
              out.append({'id': eid, 'out': outfile})

          for e in out:
              dates = days.get(e['id']) or []
              last = max((d for d in dates if d), default=None)
              if last is None or any(d is None for d in dates):
                  e['fetch'] = 'true'
                  reason = 'no usable day_date - fetching to be safe'
                  age = 'n/a'
              else:
                  age = (today - last).days
                  if age > GRACE_DAYS:
                      # K3: nothing to build from without the stored CSV.
                      if os.path.exists(f"data/{e['id']}_merged.csv"):
                          e['fetch'] = 'false'
                          reason = f'finished {age}d ago, using stored CSV'
                      else:
                          e['fetch'] = 'true'
                          reason = f'finished {age}d ago but no stored CSV - fetching'
                  else:
                      e['fetch'] = 'true'
                      reason = ('upcoming' if age < 0 else
                                f'{age}d past, inside {GRACE_DAYS}d grace')
              notes.append(f"  {e['id']:<20} last={last} age={age} "
                           f"fetch={e['fetch']}  ({reason})")

          if only:
              missing = only - {e['id'] for e in out}
              if missing:
                  raise SystemExit(f"not active events with an output_filename: {sorted(missing)}")

          # K4: the decision, per event, so a misfire is readable after the fact.
          print('DECISIONS<<EOD', file=sys.stderr)
          for line in notes:
              print(line, file=sys.stderr)
          for p in problems:
              print(f"  ::warning::{p}", file=sys.stderr)
          print('EOD', file=sys.stderr)
          print('events=' + json.dumps(out))
          PY
          cat "$GITHUB_OUTPUT"

  # --------------------------------------------------------------- build ----
  # One job per event. Each is independent, so wall-clock is the slowest single
  # event rather than the sum - and it stays that way as events are added.
  build:
    name: ${{ matrix.event.id }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      # One event failing must not cancel the others.
      fail-fast: false
      # Sequential. Three at a time was faster, but runners stopped being
      # assigned on 2026-08-06 and jobs were cancelled after 15m in the queue;
      # one at a time asks for the least and is the version that finishes.
      # Raise again once scheduling is reliably healthy.
      max-parallel: 1
      matrix:
        event: ${{ fromJson(needs.plan.outputs.events) }}

    env:
      TZ: Europe/Paris
      # Shotgun's ~100 req/min quota is shared across concurrent jobs, so each
      # fetcher paces at roughly 0.8s x max-parallel to stay under it together.
      # Keep this in step with max-parallel above - at max-parallel 1 there is
      # no sharing, and leaving it at 2.4 would triple every fetch for nothing
      # (Paris XXL alone is ~220 pages).
      SHOTGUN_PAGE_PACING_S: '0.8'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch tickets
        if: matrix.event.fetch == 'true'
        env:
          SHOTGUN_TOKEN_EPISODE: ${{ secrets.SHOTGUN_TOKEN_EPISODE }}
          SHOTGUN_TOKEN_SONORA: ${{ secrets.SHOTGUN_TOKEN_SONORA }}
          SHOTGUN_ORGANIZER_ID_SONORA: ${{ secrets.SHOTGUN_ORGANIZER_ID_SONORA }}
          DICE_TOKEN: ${{ secrets.DICE_TOKEN }}
        run: |
          mkdir -p api_output
          python fetch_csv.py --event "${{ matrix.event.id }}" \
            --out "api_output/${{ matrix.event.id }}_merged.csv"

      - name: Use the stored CSV (event finished, data frozen)
        if: matrix.event.fetch != 'true'
        run: |
          mkdir -p api_output
          cp "data/${{ matrix.event.id }}_merged.csv" \
             "api_output/${{ matrix.event.id }}_merged.csv"
          echo "::notice::${{ matrix.event.id }} not fetched - event finished, \
          rebuilt from the committed CSV ($(wc -l < "data/${{ matrix.event.id }}_merged.csv") lines)"

      # M1: the HTML changes every run whatever happens - the footer carries a
      # timestamp and the J-X countdown moves daily - so comparing HTML never
      # skips anything. The CSV is the honest test. Skipping the *rebuild* is
      # what matters: a rebuild mints a fresh timestamp, which forces a commit,
      # which fires a Pages deploy. That is the loop worth breaking.
      #
      # Finished events fall out of this for free: their CSV is copied straight
      # from data/, so it is byte-identical by construction.
      - name: Has the data changed?
        id: change
        run: |
          NEW="api_output/${{ matrix.event.id }}_merged.csv"
          OLD="data/${{ matrix.event.id }}_merged.csv"
          if [ "${{ inputs.force_rebuild }}" = "true" ]; then
            changed=true; why="forced by force_rebuild"
          elif [ ! -f "$OLD" ]; then
            changed=true; why="no stored CSV to compare against"
          elif cmp -s "$NEW" "$OLD"; then
            changed=false; why="byte-identical to the stored CSV"
          else
            changed=true; why="data differs from the stored CSV"
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          # M4: "nothing sold" and "the job broke" must be distinguishable.
          echo "::notice::${{ matrix.event.id }} changed=$changed ($why)"
          echo "- \`${{ matrix.event.id }}\` changed=**$changed** - $why" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Build dashboard
        if: steps.change.outputs.changed == 'true'
        run: |
          python scripts/build_dashboard.py \
            --event "${{ matrix.event.id }}" \
            --csv "api_output/${{ matrix.event.id }}_merged.csv" \
            --out "api_output/${{ matrix.event.id }}.html"
          python scripts/postprocess_html.py "api_output/${{ matrix.event.id }}.html"
          cp "api_output/${{ matrix.event.id }}.html" "${{ matrix.event.out }}"
          # B1: one JSON per finished edition, keyed by that edition's own
          # J-x. Written BEFORE build_v2, which reads their headers to build
          # the comparison menu - so the menu can only ever list a file that
          # exists. Cheap enough to redo per event (2.1s for all of them) and
          # much cheaper than making the ordering conditional.
          # THE SERIES MUST SEE THE FRESH CSV, AND UNTIL NOW IT DID NOT.
          # build_series.py takes no arguments: it rebuilds every series from
          # whatever sits in data/ - and at this point data/ still holds the
          # PREVIOUS run's CSV, because the staging copy happens several steps
          # further down. Meanwhile build_v2.py below is handed the freshly
          # fetched api_output/ CSV. So every commit shipped a series exactly
          # one fetch cycle behind the page built beside it, and a reader
          # comparing against a LIVE edition saw yesterday's candidate drawn
          # against today's page.
          #
          # That is the same "two vintages in one chart" the mock's
          # {cache:'no-cache'} exists to stop in the browser - while the
          # pipeline was doing it upstream, where no cache header could help.
          #
          # Measured on 2026-08-11, all from commit db28b0b: epk series 126 vs
          # its own CSV 139 paid, geneve 34 vs 37, bordeaux_oct 53 vs 61.
          # check_b1_switch fails on it, which is how it surfaced - the client
          # reads series/, the server side reads data/, and the two disagreed.
          cp "api_output/${{ matrix.event.id }}_merged.csv" \
             "data/${{ matrix.event.id }}_merged.csv"
          python scripts/build_series.py
          # CUTOVER §3(a): pass 0 publishes to the ROOT. It was `v2/<out>` while
          # the redesign shipped alongside production; the old pipeline's pages
          # now live in legacy/ and this is the only builder. Path derived here,
          # not from output_filename, which is free text on 22 rows.
          #
          # scripts/cutover.py --apply REFUSES while this still says v2/, because
          # moving the pages without this leaves production stale within four
          # hours while every check still passes (§7bis).
          python scripts/build_v2.py --event "${{ matrix.event.id }}" \
            --csv "api_output/${{ matrix.event.id }}_merged.csv" \
            --out "${{ matrix.event.out }}"

      # N4: M1 skips the rebuild when the CSV is byte-identical, which also
      # freezes the footer's "Données API · HH:MM". That stamp answers "how
      # fresh is the CHECK", not "how fresh is the DATA" - the ticket stamp
      # beside it already answers that - so leaving it frozen makes a quiet
      # event look like a broken pipeline. Twice misdiagnosed here already.
      #
      # So patch the one line instead of regenerating the page: a one-line
      # diff per quiet event, and run.py is never invoked.
      #
      # Only ever reached after a SUCCESSFUL fetch or a deliberate skip - a
      # failed fetch fails the job at that step and never gets here, leaving
      # the previous stamp in place, which is the honest outcome.
      - name: Restamp the footer
        id: stamp
        if: steps.change.outputs.changed != 'true' || matrix.event.fetch != 'true'
        run: |
          OUT="${{ matrix.event.out }}"
          # ONE location since the cutover: the page at the root IS pass 0's.
          # It used to name the staging copy as well - both halves of a pipeline
          # that no longer has two. That literal is deliberately NOT repeated in
          # this comment: check_v2_footer clause 5 greps this step's body as
          # text, so a comment mentioning it would satisfy the check that is
          # supposed to track the change. Found by running the check rather than
          # assuming it would go red.
          #
          # This step exists BECAUSE a quiet run skips the
          # rebuild - a footer that exists and never refreshes is worse than
          # none, it asserts a sync time that stopped being true, which is the
          # class this project keeps finding and misdiagnosed twice before M1.
          #
          # check_v2_footer clause 5 asserts this from the other side, derived
          # from pages.pass0_dir() rather than a literal, so it tracks the
          # change instead of being broken by it.
          TARGETS="$OUT"
          if [ "${{ matrix.event.fetch }}" = "true" ]; then
            # Fetched, nothing moved. Bump the check time.
            # TZ=Europe/Paris, not bare date: the runner is UTC, so a bare
            # date stamps a time that reads as Paris and is 1-2h slow
            # depending on the season. Same class of bug as the last-ticket
            # time, different cause - this one is our own clock, not run.py's.
            for f in $TARGETS; do
              python scripts/stamp_footer.py "$f" --checked "$(TZ=Europe/Paris date +%H:%M)"
            done
          else
            # Finished event: nothing was fetched, so the check stamp must not
            # move. Switch to the frozen label instead, keeping whatever freeze
            # date the published page already carries - a force_rebuild would
            # otherwise overwrite it with a fresh "Données API" stamp implying
            # a fetch that never happened.
            # The freeze date is read from the PRODUCTION page for both, so
            # the two never disagree about when the numbers stopped moving.
            prev=$(git show "HEAD:$OUT" 2>/dev/null \
                   | python scripts/stamp_footer.py - --read-frozen || true)
            for f in $TARGETS; do
              python scripts/stamp_footer.py "$f" --frozen "${prev:-$(TZ=Europe/Paris date +%d/%m)}"
            done
          fi
          if git diff --quiet -- $TARGETS; then
            echo "stamped=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ matrix.event.id }} footer already current"
          else
            echo "stamped=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Summarise
        if: always()
        run: |
          CSV="api_output/${{ matrix.event.id }}_merged.csv"
          [ -f "$CSV" ] || exit 0
          {
            echo "### ${{ matrix.event.id }} -> ${{ matrix.event.out }}"
            echo ""
            echo '| tickets | shotgun | dice | gross (paid) |'
            echo '|---|---|---|---|'
            python - "$CSV" "${{ matrix.event.id }}" <<'PY'
          import csv, sys
          from collections import Counter
          rows = list(csv.DictReader(open(sys.argv[1], encoding='utf-8')))
          c = Counter(r['platform'] for r in rows)
          gross = sum(float(r['gross_price']) for r in rows if r['is_paid'] == '1')
          print(f"| {len(rows)} | {c.get('Shotgun',0)} | {c.get('DICE',0)} | EUR {gross:,.2f} |")

          # A configured platform returning nothing is a silent undercount, not
          # "no sales" - it has been a wrong organizer, a missing
          # include_cohosted_events, and a stale event id so far.
          cfg = {}
          for row in csv.DictReader(open('event_config.csv', encoding='utf-8-sig')):
              if (row.get('event_id') or '').strip() == sys.argv[2] and (row.get('event_name') or '').strip():
                  cfg = row
                  break
          warn = []
          if (cfg.get('shotgun_event_id') or '').strip() and c.get('Shotgun', 0) == 0:
              warn.append(f"Shotgun id {cfg['shotgun_event_id'].strip()} configured, 0 tickets returned")
          if (cfg.get('dice_mio_id') or '').strip() and c.get('DICE', 0) == 0:
              warn.append(f"DICE id {cfg['dice_mio_id'].strip()} configured, 0 tickets returned")
          if warn:
              print()
              print('> [!WARNING]')
              for w in warn:
                  print(f"> - {w}")
              print('> Diagnose: `python scripts/probe_shotgun_account.py <shotgun_event_id>`')
          PY
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Stage the merged CSV for commit
        if: steps.change.outputs.changed == 'true'
        run: |
          mkdir -p data
          cp "api_output/${{ matrix.event.id }}_merged.csv" \
             "data/${{ matrix.event.id }}_merged.csv"

      - name: Upload dashboard
        if: steps.change.outputs.changed == 'true' || steps.stamp.outputs.stamped == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-${{ matrix.event.id }}
          path: |
            ${{ matrix.event.out }}
            data/${{ matrix.event.id }}_merged.csv
            series/${{ matrix.event.id }}.json
          if-no-files-found: error
          retention-days: 1

  # -------------------------------------------------------------- commit ----
  # Parallel jobs must not each push to main. Collect every dashboard that
  # built and commit them in one go; events that failed simply contribute
  # nothing and leave their previous HTML in place.
  commit:
    name: Commit dashboards
    needs: build
    if: always()
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Paris

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Every event may have skipped, in which case there is nothing to
      # download and nothing to commit - that is the quiet-hour path, not a
      # failure.
      - name: Download built dashboards
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: dashboard-*
          merge-multiple: true
          path: .

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # RECURSIVE, and that is what makes the exclusions load-bearing
          # (CUTOVER §6.4). This is what staged `v2/*.html` before the cutover -
          # intended, never stated - and it is what would sweep `legacy/*.html`
          # into every daily commit now. An archive re-staged daily is not an
          # archive: the frozen pages would keep reappearing in the history as
          # though something still built them, and their banner would say
          # otherwise on the same commit.
          #
          # Excluded by name with the reason, per §6.4, rather than by a pattern
          # that happens to miss them.
          git add -- '*.html' ':!dashboard_template.html' ':!legacy/*.html'
          # The merged CSVs are the state an incremental fetch resumes from.
          # Explicit paths only - data/ also holds Railway's raw uploads, which
          # carry contact details and must never be committed.
          # Split deliberately. A quoted pathspec matching nothing makes
          # `git add` exit 128 AND stage nothing from that command, and each
          # run: block is `bash -e`, so combining these aborted the step before
          # the commit - on every run since the line was written. No
          # *_state.json has ever existed: the daily job calls fetch_csv.py
          # without --incremental, and the commit job only sees the artifacts
          # the build jobs uploaded, which do not include state files.
          #
          # `|| true` stays OFF the merged CSVs. Those must always be present -
          # they are what an incremental fetch resumes from - so a failure there
          # is real and must not be swallowed.
          git add -- 'data/*_merged.csv'
          git add -- 'data/*_state.json' 2>/dev/null || true
          # B1's series files. Their own line, and NOT `|| true`: the v2 pages
          # fetch these by name, so a run that rebuilds the pages without them
          # ships six dashboards whose every comparison says "indisponible".
          #
          # This line staged NOTHING for as long as it existed, and was right
          # anyway: `series/` was not in the build job's artifact list, so the
          # commit job only ever saw the committed copies - and every series was
          # immutable, being a finished edition's frozen history. Emitting series
          # for LIVE editions turned a harmless no-op into a silent staleness:
          # four files now change daily and none of them was reaching the repo.
          # Fixed at the artifact, where the premise actually broke.
          #
          # Each build job uploads ONLY its own event's series file. A job holds
          # exactly one freshly-fetched CSV and rebuilds every series from
          # whatever else is committed, so uploading them all would let the last
          # job to finish overwrite five other events with its stale copies -
          # `merge-multiple: true` resolves collisions by arrival order, not by
          # freshness.
          git add -- 'series/*.json'
          # Trap #17: a finished event's CSV never changes, so its page is
          # exempt from every shared-code and shared-CSS change unless
          # something forces a rebuild. This FAILS the run rather than fixing
          # it, deliberately: the fix is to rebuild, and a job that silently
          # repaired itself would hide how long the exemption had been running.
          python verify/check_build_stamp.py
          # The two eligibility rules, both directions. Runs HERE rather than
          # in a build job because both halves of it are cross-event: "every
          # series file is reachable from some menu" is a statement about the
          # whole set, and a per-event matrix job only ever sees one page.
          python verify/check_eligibility.py
          # The anchoring enum. Both branches of comparison_mode, on the
          # pair whose campaign lengths differ most - run on a pair where
          # they nearly match, the same test passes while showing nothing.
          python verify/check_anchor_modes.py
          # THE THREE BROWSER CHECKS ARE NOT HERE, AND MUST NOT BE PUT BACK
          # WITHOUT A BROWSER. check_section_bars, check_section_heads and
          # check_float_clamp each drive playwright and each hardcodes
          # CHROME = '/opt/pw-browsers/chromium-1194/…', with NODE_PATH pointing
          # at /opt/node22/lib/node_modules. Both are DEV-CONTAINER paths. A
          # GitHub runner has neither, and this job installs neither, so the
          # first line of the three died on `FileNotFoundError: 'node'`.
          #
          # They were added in b03a9cc and the very next scheduled run, #36 on
          # 2026-08-10 16:41Z, failed. So did #37 through #42: seven consecutive
          # runs, ~28 hours, every one of them fetching and building correctly
          # and then failing at the gate. Nothing was committed in that window,
          # which is why the footer read "Données API 00:06" against CSVs
          # carrying tickets from 10/08 14:43 - the stamp had not frozen, the
          # COMMIT had.
          #
          # check_selector.js already carries this rule in its own header:
          # "Needs playwright and the preinstalled chromium; it is therefore NOT
          # wired into verify/assert_redesign.sh". The same reasoning applies to
          # any check that drives a browser. They live in verify/CHECKLIST.md
          # and are run by hand.
          #
          # The gate that remains is everything that runs on python alone.
          if git diff --cached --quiet; then
            echo "Nothing changed - nothing to commit"
            exit 0
          fi
          git commit -m "Auto-update dashboards · $(date -u +%Y-%m-%d)"
          # A GENERATED PAGE IS NEVER TEXT-MERGED.
          #
          # This retry used to be `git pull --rebase`, which asks git to
          # reconcile two INDEPENDENTLY GENERATED 250 KB HTML pages line by
          # line. Git loses: run #46 hit content conflicts in
          # v2/bordeaux_oct.html, v2/geneve.html and v2/rennes.html, retried
          # three times and exited 1 - with every check in that run passing. It
          # failed at the push, and nothing landed.
          #
          # The rule this project already states is that a conflict in a
          # generated file is resolved by REBUILDING from the mock, never by
          # merging, because a text-merged page is a file no generator produced.
          # This was the one place that could not follow it. Now it does.
          pushed=""
          for attempt in 1 2 3; do
            if git push; then pushed=1; break; fi
            echo "push rejected (attempt $attempt) - rebasing onto origin/main"
            # THE FETCHED CSVs, PRESERVED ACROSS THE REBASE. `data/` here holds
            # what the build jobs fetched, carried in their artifacts. A rebase
            # replaces it with origin's committed copies, and rebuilding from
            # THOSE would reintroduce the one-cycle vintage skew fixed a few
            # steps above. So they are set aside and put back before any
            # rebuild reads them.
            rm -rf /tmp/fetched && mkdir -p /tmp/fetched
            cp data/*_merged.csv /tmp/fetched/ 2>/dev/null || true
            git fetch origin main || break
            if ! git rebase origin/main; then
              unresolved=$(git diff --name-only --diff-filter=U)
              echo "conflicts: $unresolved"
              for f in $unresolved; do
                case "$f" in
                  legacy/*)
                    # BEFORE the artefact branch, and it must stay before it.
                    # A `case` pattern matches slashes, so `*.html` alone
                    # matches `legacy/rennes.html` - which would take a side
                    # arbitrarily and then hand the file to rebuild_pages.py,
                    # REBUILDING a frozen archive from live data. The banner
                    # would still say the numbers stopped moving.
                    #
                    # A conflict here is not a generated artefact about to be
                    # overwritten. It is someone editing the archive, and that
                    # needs a human.
                    echo "::error::conflict in $f - legacy/ is a frozen \
                    archive, not a rebuildable artefact"
                    git rebase --abort || true
                    exit 1 ;;
                  *.html|series/*.json)
                    # Take a side ARBITRARILY - it is about to be overwritten by
                    # a rebuild. Which side wins does not matter; that no merge
                    # happens is the whole point.
                    #
                    # `v2/*.html` was dropped from this list at cutover: it was
                    # always redundant, because `case` matches `/` inside `*`.
                    git checkout --ours -- "$f" 2>/dev/null \
                      || git checkout --theirs -- "$f" ;;
                  *)
                    echo "::error::conflict in $f, which is not a generated \
                    artefact - this needs a human, not a rebuild"
                    git rebase --abort || true
                    exit 1 ;;
                esac
              done
              cp /tmp/fetched/*_merged.csv data/ 2>/dev/null || true
              python scripts/build_series.py
              html=$(echo "$unresolved" | tr ' ' '\n' | grep -E '\.html$' || true)
              if [ -n "$html" ]; then
                python scripts/rebuild_pages.py $html || {
                  echo "::error::rebuild did not resolve the conflict"
                  git rebase --abort || true
                  exit 1
                }
              fi
              git add -A
              # FAIL LOUDLY rather than push something no generator produced.
              if git diff --name-only --diff-filter=U | grep -q .; then
                echo "::error::still unresolved after rebuild"
                git rebase --abort || true
                exit 1
              fi
              GIT_EDITOR=true git rebase --continue || {
                echo "::error::rebase --continue failed after rebuild"
                git rebase --abort || true
                exit 1
              }
            fi
            sleep 3
          done
          [ -n "$pushed" ] || { echo "::error::could not push dashboards after 3 attempts"; exit 1; }

      # AFTER THE PUSH, DELIBERATELY, AND NOT IN THE GATE ABOVE.
      # The 28-hour outage this check exists for was CAUSED by a check in that
      # gate. A stale-data alarm that also blocks the commit that would clear it
      # is the same mistake twice, so this runs once the data is safely landed:
      # it can turn the badge red, and it can never freeze the pipeline.
      #
      # It answers the question the footer cannot. "Données API HH:MM" is
      # written when a page is REBUILT, so it moves only when something else
      # already changed - and a stopped fetch and a stopped commit both leave it
      # frozen at the last run that landed.
      - name: Is the data actually fresh?
        run: python verify/check_data_freshness.py

  # THE BADGE HAS TO REACH SOMEONE. Trap #13 was a `git add` pathspec failing in
  # this same job, diagnosed as "a signal that always fires carries no
  # information" - and then the same job failed for seven consecutive runs and
  # nobody noticed for a day, because the page cannot report it and no one
  # watches Actions. The lesson did not enforce itself, so this does.
  #
  # ONE issue, reopened and commented rather than one per failure: seven
  # notifications for one outage is how an alert becomes noise. It CLOSES itself
  # on the next green run, so an open issue always means "broken right now"
  # rather than "was broken once".
  alert:
    needs: commit
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open, update or close the failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const failed = '${{ needs.commit.result }}' !== 'success';
            const title = 'Daily dashboards: the pipeline is not landing data';
            const {owner, repo} = context.repo;
            const found = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'pipeline-down', per_page: 20});
            const issue = found.data.find(i => i.title === title);
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            if (failed) {
              const body = [
                `The \`commit\` job did not succeed: **${{ needs.commit.result }}**.`,
                ``,
                `Run: ${run}`,
                ``,
                `Nothing new has reached \`main\`, so every dashboard is serving`,
                `whatever the last successful run left behind. The footer's`,
                `"Données API" stamp will NOT show this - it is written when a`,
                `page is rebuilt, so it stays frozen at the last run that landed.`,
                ``,
                `This issue closes itself on the next green run.`,
              ].join('\n');
              if (issue) {
                await github.rest.issues.createComment(
                  {owner, repo, issue_number: issue.number, body});
              } else {
                await github.rest.issues.create(
                  {owner, repo, title, body, labels: ['pipeline-down']});
              }
            } else if (issue) {
              await github.rest.issues.createComment({owner, repo,
                issue_number: issue.number,
                body: `Recovered: the commit job succeeded. ${run}`});
              await github.rest.issues.update({owner, repo,
                issue_number: issue.number, state: 'closed',
                state_reason: 'completed'});
            }
