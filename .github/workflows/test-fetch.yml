name: Test fetch (Rennes 2026)

# Manual-only: the API fetch needs network access to Shotgun/DICE plus the
# repository secrets, neither of which exist outside a runner.
on:
  workflow_dispatch:

jobs:
  fetch:
    name: Fetch Rennes 2026 tickets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Shotgun + DICE and write merged CSV
        env:
          SHOTGUN_TOKEN_EPISODE: ${{ secrets.SHOTGUN_TOKEN_EPISODE }}
          SHOTGUN_TOKEN_SONORA: ${{ secrets.SHOTGUN_TOKEN_SONORA }}
          SHOTGUN_ORGANIZER_ID_SONORA: ${{ secrets.SHOTGUN_ORGANIZER_ID_SONORA }}
          DICE_TOKEN: ${{ secrets.DICE_TOKEN }}
        run: python fetch_csv.py --event rennes_2026

      - name: Add CSV preview to the job summary
        if: always()
        run: |
          CSV=api_output/rennes_2026_merged.csv
          if [ ! -f "$CSV" ]; then
            echo "No CSV was produced - see the fetch step log." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### rennes_2026_merged.csv"
            echo ""
            echo "Rows (excluding header): $(( $(wc -l < "$CSV") - 1 ))"
            echo ""
            echo '```csv'
            head -n 6 "$CSV"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload merged CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rennes-2026-merged-csv
          path: api_output/rennes_2026_merged.csv
          if-no-files-found: error

      - name: Generate HTML dashboard
        run: |
          python scripts/build_dashboard.py \
            --event rennes_2026 \
            --csv api_output/rennes_2026_merged.csv \
            --out api_output/rennes_2026.html

      - name: Report product_name breakdown
        if: always()
        run: |
          CSV=api_output/rennes_2026_merged.csv
          [ -f "$CSV" ] || exit 0
          {
            echo "### product_name values"
            echo ""
            echo '| product_name | platform | tickets |'
            echo '|---|---|---|'
            python - "$CSV" <<'PY'
          import csv, sys
          from collections import Counter
          rows = list(csv.DictReader(open(sys.argv[1], encoding='utf-8')))
          counts = Counter((r['product_name'], r['platform']) for r in rows)
          for (name, platform), n in sorted(counts.items()):
              print(f'| {name} | {platform} | {n} |')
          print()
          print(f'Distinct product_name values: {len({n for n, _ in counts})}')
          PY
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rennes-2026-dashboard-html
          path: api_output/rennes_2026.html
          if-no-files-found: error
